name: Actualizar Services

on:
  schedule:
    - cron: '17 5 * * *'   # cada día, 05:17 UTC
  workflow_dispatch:        # también a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: services

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Descargar de Planning Center
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          GUIDE_PASSWORD: ${{ secrets.GUIDE_PASSWORD }}
          PCO_SERVICE_TYPE: ${{ vars.PCO_SERVICE_TYPE }}
          PCO_FOCUS: ${{ vars.PCO_FOCUS }}
        run: python tools/fetch_services.py services.json.enc
      - name: Guardar si ha cambiado
        run: |
          if [ -n "$(git status --porcelain services.json.enc)" ]; then
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services.json.enc
            git commit -m "Services: datos actualizados"
            git push
          fi
